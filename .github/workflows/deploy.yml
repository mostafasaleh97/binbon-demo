# Build the image, push it to ECR (tagged with the commit SHA) and roll the
# ECS app service onto it. AWS access is via OIDC -- no keys stored in GitHub.
# The role and its permissions are defined in binbon-infra/github.tf.
name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write   # required to request the OIDC token for AWS
  contents: read

# never run two deployments at once; queue them instead
concurrency:
  group: deploy-dev
  cancel-in-progress: false

env:
  AWS_REGION: eu-north-1
  AWS_ROLE_ARN: arn:aws:iam::007924090369:role/binbon-dev-github-actions
  ECR_REPOSITORY: binbon/demo
  ECS_CLUSTER: binbon-dev-cluster
  ECS_SERVICE: binbon-dev-demo
  TASK_FAMILY: binbon-dev-demo
  CONTAINER_NAME: demo

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        id: image
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
        run: |
          docker build --platform linux/amd64 -t "$IMAGE" .
          docker push "$IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      # start from the live task definition so env vars / roles set by
      # Terraform are kept; only the image changes
      - name: Fetch current task definition
        run: |
          aws ecs describe-task-definition --task-definition "$TASK_FAMILY" \
            --query taskDefinition > task-definition.json

      - name: Set new image in task definition
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.image.outputs.image }}

      - name: Deploy to ECS and wait until healthy
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          cluster: ${{ env.ECS_CLUSTER }}
          service: ${{ env.ECS_SERVICE }}
          wait-for-service-stability: true

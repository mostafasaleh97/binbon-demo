{% extends "base.html" %}
{% block title %}Log in · Binbon{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="card auth-card">
    <img class="logo" src="/static/logo.svg" alt="Binbon">
    <h1>Welcome back</h1>
    <p class="sub">Log in to see your photos.</p>

    {% if error %}<div class="alert alert-error">{{ error }}</div>{% endif %}

    <form method="post" action="/login">
      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" value="{{ form.email or '' }}" autocomplete="email" required autofocus>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
      </div>
      <button class="btn btn-primary btn-block btn-lg" type="submit">Log in</button>
    </form>
    <p class="switch">New to Binbon? <a href="/signup">Create an account</a></p>
  </div>
</div>
{% endblock %}
